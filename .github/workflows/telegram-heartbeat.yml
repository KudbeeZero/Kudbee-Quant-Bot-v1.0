name: Telegram heartbeat (every 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send heartbeat with trading summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing secrets"; exit 1
          fi
          SUMMARY=$(python - <<'PY'
import json, datetime
d=json.load(open('data/journal.json'))
res=[x for x in d if x.get('status') in ('hit','miss')]
n=len(res)
s=sum((x.get('outcome_r') or 0) for x in res)
openn=sum(1 for x in d if x.get('status')=='open')
print(f"Kudbee heartbeat {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')} | resolved={n} open={openn} sumR={s:.2f}")
PY
)
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$SUMMARY" \
            -d disable_web_page_preview=true
