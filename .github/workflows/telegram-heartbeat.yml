name: Telegram heartbeat (every 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send heartbeat with trading summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing secrets"; exit 1
          fi
          N=$(jq '[.[] | select(.status=="hit" or .status=="miss")] | length' data/journal.json)
          S=$(jq '[.[] | select(.status=="hit" or .status=="miss") | (.outcome_r // 0)] | add' data/journal.json)
          O=$(jq '[.[] | select(.status=="open")] | length' data/journal.json)
          MSG="Kudbee heartbeat $(date -u +'%Y-%m-%d %H:%M UTC') | resolved=${N} open=${O} sumR=${S}"
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG" \
            -d disable_web_page_preview=true
